<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Egg Catch Game</title>
    <style>
      .egg {
        position: absolute;
        width: 80px;
        height: 90px;
      }
      .basket {
        position: absolute;
        width: 160px;
        height: 80px;
        bottom: 0;
      }
      #score {
        position: absolute;
        top: 10px;
        left: 50%;
        font-size: 20px;
      }
      #stopBtn {
        position: absolute;
        top: 10px;
        left: 10px;
      }
    </style>
  </head>
  <body>
    <p id="score">Score: 0</p>
    <button id="stopBtn">Stop Game</button>
    <script src="egg.js"></script>
  </body>
</html>
